name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
defaults:
  run:
    working-directory: turntable-desktop
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: turntable-${{ matrix.os }}
          path: |
            turntable-desktop/dist/*.exe
            turntable-desktop/dist/*.dmg
            turntable-desktop/dist/*.AppImage
            turntable-desktop/dist/*.deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: turntable-windows-unpacked
          path: turntable-desktop/dist/win-unpacked
